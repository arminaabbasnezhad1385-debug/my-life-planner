<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | My Life Planner
    </title>


    <link
        rel="stylesheet"
        href="css/auth.css"
    >

</head>


<body>


    <main class="auth-page">


        <section class="auth-card">


            <div class="auth-logo">
                🌷
            </div>


            <h1>
                My Life Planner
            </h1>


            <p class="auth-description">
                Login to continue to your planner.
            </p>



            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="auth-field">

                    <label for="loginEmail">
                        Email
                    </label>


                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="auth-field">

                    <label for="loginPassword">
                        Password
                    </label>


                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Your password"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- SHOW PASSWORD -->

                <label class="show-password-row">

                    <input
                        type="checkbox"
                        id="showPassword"
                    >

                    Show password

                </label>



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                    class="auth-button"
                >
                    Login
                </button>


            </form>



            <!-- MESSAGE -->

            <div
                id="authMessage"
                class="auth-message"
            >
            </div>



            <!-- CONNECTION STATUS -->

            <div
                id="connectionStatus"
                class="connection-status"
            >
                Checking Supabase connection...
            </div>


        </section>


    </main>



    <!-- SUPABASE LIBRARY -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- SUPABASE CONFIG -->

    <script
        src="js/supabase-config.js"
    ></script>


    <!-- LOGIN -->

    <script
        src="js/auth.js"
    ></script>


</body>

</html>
